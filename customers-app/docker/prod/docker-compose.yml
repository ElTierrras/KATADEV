# ============================================================
# Ambiente: PROD (simulado)
# Levanta Postgres (con su propia base de datos y volumen) y el
# backend en modo prod (puerto 9090)
# ============================================================
services:
  postgres-prod:
    image: postgres:16
    container_name: postgres_customers_prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: customers_app
      POSTGRES_PASSWORD: prod_pass_example
      POSTGRES_DB: customers_prod
    ports:
      - "5444:5432"
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
      - ../../src/db/migrations/001_init_customers.sql:/docker-entrypoint-initdb.d/001_init_customers.sql
      # Nota: a propósito NO se monta ningún archivo de seed aquí.
      # Prod (simulado) siempre arranca sin datos ficticios precargados.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U customers_app -d customers_prod"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - customers-net-prod

  backend-prod:
    build:
      context: ../..
      dockerfile: docker/Dockerfile
    container_name: backend_customers_prod
    restart: unless-stopped
    environment:
      APP_ENV: prod
      APP_NAME: customers-prod
      PORT: 9090
      LOG_MESSAGE: "Ejecutando en PROD"
      DB_HOST: postgres-prod
      DB_PORT: 5432
      DB_NAME: customers_prod
      DB_USER: customers_app
      DB_PASSWORD: prod_pass_example
      DB_SSL: "false"
    ports:
      - "9090:9090"
    depends_on:
      postgres-prod:
        condition: service_healthy
    networks:
      - customers-net-prod

volumes:
  postgres_data_prod:

networks:
  customers-net-prod:
